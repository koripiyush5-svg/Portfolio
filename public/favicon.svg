<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="#050816" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="50" cy="50" r="20" fill="url(#eyeGlow)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="8" fill="#050816"/>
  <circle cx="50" cy="50" r="3" fill="#00e5ff" filter="url(#glow)"/>
</svg>

